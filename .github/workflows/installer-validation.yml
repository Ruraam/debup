name: Installer validation

on:
  push:
    branches:
      - main
      - "hardening/**"
    paths:
      - "installer.sh"
      - "scripts/sync_catalog.sh"
      - "tests/test_sync_catalog.sh"
      - ".github/workflows/installer-validation.yml"
  pull_request:
    paths:
      - "installer.sh"
      - "scripts/sync_catalog.sh"
      - "tests/test_sync_catalog.sh"
      - ".github/workflows/installer-validation.yml"

permissions:
  contents: read

jobs:
  installer-static-checks:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate Bash syntax
        run: |
          bash -n installer.sh
          bash -n scripts/sync_catalog.sh

      - name: Run ShellCheck
        run: |
          shellcheck --severity=error installer.sh
          shellcheck --severity=error scripts/sync_catalog.sh
          shellcheck --severity=error tests/test_sync_catalog.sh

      - name: Test catalog synchronization
        run: bash tests/test_sync_catalog.sh

      - name: Check required hardening guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Unknown argument:' installer.sh
          grep -Fq 'Expected exactly one primary GPG key' installer.sh
          grep -Fq 'if (filename == name)' installer.sh
          grep -Fq 'Unable to determine the system architecture' installer.sh
          grep -Fq 'APT package index update failed' installer.sh
          grep -Fq 'Failed to set executable permissions' installer.sh
          grep -Fq 'mktemp -d' scripts/sync_catalog.sh
          grep -Fq 'atomically replace the catalog' scripts/sync_catalog.sh
          ! grep -Fq '/tmp/deb-get-repo' scripts/sync_catalog.sh
          ! grep -Fq '/tmp/deb-get.csv' scripts/sync_catalog.sh
