name: Installer validation

on:
  push:
    branches:
      - main
      - "hardening/**"
    paths:
      - "installer.sh"
      - "scripts/sync_catalog.sh"
      - "tests/test_sync_catalog.sh"
      - "tests/test_search.sh"
      - "tests/test_package_validation.sh"
      - "tests/test_api_cache.sh"
      - "curated_db.txt"
      - "debup-pkg/usr/local/share/debup/**"
      - ".github/workflows/sync-catalog.yml"
      - "tests/test_package_scripts.sh"
      - "debup-pkg/DEBIAN/**"
      - "debup-pkg/usr/local/bin/**"
      - ".github/workflows/apt-repo.yml"
      - ".github/workflows/release-deb.yml"
      - ".github/workflows/installer-validation.yml"
  pull_request:
    paths:
      - "installer.sh"
      - "scripts/sync_catalog.sh"
      - "tests/test_sync_catalog.sh"
      - "tests/test_search.sh"
      - "curated_db.txt"
      - "debup-pkg/usr/local/share/debup/**"
      - ".github/workflows/sync-catalog.yml"
      - "tests/test_package_scripts.sh"
      - "debup-pkg/DEBIAN/**"
      - "debup-pkg/usr/local/bin/**"
      - ".github/workflows/apt-repo.yml"
      - ".github/workflows/release-deb.yml"
      - ".github/workflows/installer-validation.yml"

permissions:
  contents: read

jobs:
  installer-static-checks:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate Bash syntax
        run: |
          bash -n installer.sh
          bash -n scripts/sync_catalog.sh
          bash -n tests/test_sync_catalog.sh
          bash -n tests/test_search.sh
          bash -n tests/test_package_validation.sh
          bash -n tests/test_api_cache.sh
          bash -n debup-pkg/usr/local/share/debup/api_cache.sh
          bash -n debup-pkg/usr/local/share/debup/search.sh
          bash -n debup-pkg/usr/local/share/debup/package_validation.sh
          bash -n tests/test_package_scripts.sh
          bash -n debup-pkg/DEBIAN/postinst
          bash -n debup-pkg/DEBIAN/postrm
          bash -n debup-pkg/usr/local/bin/debup
          bash -n debup-pkg/usr/local/bin/dbp

      - name: Run ShellCheck
        run: |
          shellcheck --severity=error installer.sh
          shellcheck --severity=error scripts/sync_catalog.sh
          shellcheck --severity=error tests/test_sync_catalog.sh
          shellcheck --severity=error tests/test_search.sh
          shellcheck --severity=error tests/test_package_validation.sh
          shellcheck --severity=error tests/test_api_cache.sh
          shellcheck --severity=error debup-pkg/usr/local/share/debup/api_cache.sh
          shellcheck --severity=error debup-pkg/usr/local/share/debup/search.sh
          shellcheck --severity=error debup-pkg/usr/local/share/debup/package_validation.sh
          shellcheck --severity=error tests/test_package_scripts.sh
          shellcheck --severity=error debup-pkg/DEBIAN/postinst
          shellcheck --severity=error debup-pkg/DEBIAN/postrm
          shellcheck --severity=error debup-pkg/usr/local/bin/debup
          shellcheck --severity=error debup-pkg/usr/local/bin/dbp

      - name: Verify debup and dbp are identical
        run: cmp -s debup-pkg/usr/local/bin/debup debup-pkg/usr/local/bin/dbp

      - name: Test package metadata and checksum validation
        run: bash tests/test_package_validation.sh

      - name: Test GitHub API cache failure handling
        run: bash tests/test_api_cache.sh

      - name: Test curated search catalog
        run: bash tests/test_search.sh

      - name: Test catalog synchronization
        run: bash tests/test_sync_catalog.sh

      - name: Test Debian maintainer scripts
        run: bash tests/test_package_scripts.sh

      - name: Build and inspect Debian package
        shell: bash
        run: |
          set -Eeuo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$work_dir"' EXIT
          cp -a debup-pkg "$work_dir/debup-pkg"
          chmod 0755 "$work_dir/debup-pkg/DEBIAN/postinst" "$work_dir/debup-pkg/DEBIAN/postrm"
          dpkg-deb --build --root-owner-group "$work_dir/debup-pkg" "$work_dir/debup-ci.deb"
          [[ "$(dpkg-deb -f "$work_dir/debup-ci.deb" Package)" == "debup" ]]
          [[ "$(dpkg-deb -f "$work_dir/debup-ci.deb" Architecture)" == "all" ]]
          dpkg-deb --contents "$work_dir/debup-ci.deb" >/dev/null
          cmp -s curated_db.txt debup-pkg/usr/local/share/debup/curated_db.txt
          dpkg-deb --fsys-tarfile "$work_dir/debup-ci.deb" | tar -tf - | grep -Fxq "./usr/local/share/debup/curated_db.txt"

          sudo apt-get install -y curl jq
          sudo apt-get install -y "$work_dir/debup-ci.deb"
          grep -Fxq 'debup|Ruraam/debup' /etc/debup/sources.list
          printf 'preserve this user file\n' | sudo tee /etc/debup/custom.conf >/dev/null
          sudo apt-get purge -y debup
          [[ -f /etc/debup/custom.conf ]]
          sudo rm -f /etc/debup/custom.conf
          sudo rmdir /etc/debup

      - name: Check required hardening guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Unknown argument:' installer.sh
          grep -Fq 'Expected exactly one primary GPG key' installer.sh
          grep -Fq 'if (filename == name)' installer.sh
          grep -Fq 'Unable to determine the system architecture' installer.sh
          grep -Fq 'APT package index update failed' installer.sh
          grep -Fq 'Failed to set executable permissions' installer.sh
          grep -Fq 'mktemp -d' scripts/sync_catalog.sh
          grep -Fq 'atomically replace the catalog' scripts/sync_catalog.sh
          ! grep -Fq '/tmp/deb-get-repo' scripts/sync_catalog.sh
          ! grep -Fq '/tmp/deb-get.csv' scripts/sync_catalog.sh
