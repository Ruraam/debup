name: Sync Curated Catalog

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-lates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run sync script
        run: |
          chmod +x scripts/sync_catalog.sh
          ./scripts/sync_catalog.sh

      - name: Commit and push catalog
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add curated_db.txt
          if git diff --staged --quiet; then
            echo "[-] Aucun changement détecté."
          else
            git commit -m "chore(catalog):sync deb-get catalog [skip ci]"
            git push
            echo "[+] Catalogue mis à jour et poussé avec succès."
          fi
