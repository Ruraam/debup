name: Sync Curated Catalog

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout debup repository
        uses: actions/checkout@v4

      - name: Clone deb-get and extract safe packages
        run: |
          echo "[*] Cloning wimpysworld/deb-get definitions..."
          git clone --depth 1 https://github.com/wimpysworld/deb-get.git /tmp/deb-get

          CATALOG_FILE="curated_db.txt"
          > "$CATALOG_FILE"

          echo "[*] Processing recipes..."
          for recipe in /tmp/deb-get/01-main/packages/*; do
            [ -f "$recipe" ] || continue
            pkg_name=$(basename "$recipe")

            (
              GITHUB_REPO=""
              DIRECT_URL=""
              APT_PPA=""
              APT_REPO=""

              source "$recipe" 2>/dev/null || true

              if [ -n "$GITHUB_REPO" ]; then
                echo "${pkg_name}|github|${GITHUB_REPO}"

              elif [ -n "$DIRECT_URL" ] && [ -z "$APT_PPA" ] && [ -z "$APT_REPO" ]; then
                echo "${pkg_name}|direct|${DIRECT_URL}"
              fi
            )>> "$CATALOG_FILE"
          done

          sed -i '/^[[:space:]]*$/d' "$CATALOG_FILE"
          sort -u -o "$CATALOG_FILE" "$CATALOG_FILE"

          echo "[+] Filtered safe packages generated: $(wc -l < "$CATALOG_FILE")"

      - name: Commit and push catalog
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add curated_db.txt

          if git diff --staged--quiet; then
            echo "[-] No changes detected in catalog."
          else
            git commit -m "chore(catalog): syncsafe deb-get definitions [skip ci]"
            git push
            echo "[+] Catalog updated and pushed successfully."
          fi
