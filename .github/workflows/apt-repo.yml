name: Update APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro gpg

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p debs
          TAG="${{ github.event.release.tag_name }}"
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern "*.deb" --dir debs/
          else
            gh release download --pattern "*.deb" --dir debs/
          fi

      - name: Import GPG Key and build APT repository
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent

          echo "$GPG_KEY" | gpg --batch --yes --import

          KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec' | cut -d: -f5)
          echo "Using GPG Key ID: $KEY_ID"

          mkdir -p public/conf
          cat <<EOF > public/conf/distributions
          Origin: debup
          Label: debup
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: debup official repository
          SignWith: $KEY_ID
          EOF

          cd public
          for deb in ../debs/*.deb; do
            if [ -f "$deb" ]; then
            reprepro --ask-passphrase includedeb stable "$deb" || reprepro includedeb stable "$deb"
            fi
          done

          gpg --armor --export "$KEY_ID" > debup.gpg
          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
