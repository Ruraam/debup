name: Update APT Repository

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to publish (for example v4.1.0)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gpg

      - name: Download assets from the requested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p debs

          for attempt in $(seq 1 12); do
            rm -f debs/*.deb
            if gh release download "$RELEASE_TAG" --pattern "*.deb" --dir debs/ --clobber; then
              if find debs -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
                break
              fi
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Error: No .deb assets found in release $RELEASE_TAG." >&2
              exit 1
            fi
            echo "Waiting for DEB assets for release $RELEASE_TAG (attempt $attempt/12)..."
            sleep 5
          done

          mapfile -t packages < <(find debs -maxdepth 1 -type f -name '*.deb' -print | sort)
          (("${#packages[@]}" > 0)) || {
            echo "Error: Release contains no Debian packages." >&2
            exit 1
          }

          for package in "${packages[@]}"; do
            [[ "$(dpkg-deb -f "$package" Package)" == "debup" ]] || {
              echo "Error: Unexpected package in release: $package" >&2
              exit 1
            }
          done

      - name: Import signing key and build APT repository
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GPG_KEY" ]] || {
            echo "Error: GPG_PRIVATE_KEY secret is empty." >&2
            exit 1
          }

          export GNUPGHOME="$RUNNER_TEMP/debup-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s\n' "$GPG_KEY" | gpg --batch --import

          mapfile -t key_ids < <(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "sec" { print $5 }')
          (("${#key_ids[@]}" == 1)) || {
            echo "Error: Expected exactly one secret primary key; found ${#key_ids[@]}." >&2
            exit 1
          }
          KEY_ID="${key_ids[0]}"

          mkdir -p public/conf
          cat > public/conf/distributions <<EOF
          Origin: debup
          Label: debup
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: debup official repository
          SignWith: $KEY_ID
          EOF

          cd public
          for deb in ../debs/*.deb; do
            [[ -f "$deb" ]] || continue
            reprepro --ask-passphrase includedeb stable "$deb"
          done

          gpg --batch --armor --export "$KEY_ID" > debup.gpg
          [[ -s debup.gpg ]] || {
            echo "Error: Failed to export the repository public key." >&2
            exit 1
          }
          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
