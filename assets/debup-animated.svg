<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="debup" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .fb { transform-box: fill-box; transform-origin: center; }
    #arrow { animation: up 2.8s ease-in-out infinite; }
    #cube { animation: cubeGlow 2.8s ease-in-out infinite; }
    #cubeFill { animation: fillPulse 2.8s ease-in-out infinite; }
    #curve { animation: shimmer 3.5s ease-in-out infinite; }
    .dot { animation: dot 2.8s ease-in-out infinite; }
    .dot2 { animation-delay: 1.4s; }
    #bup { animation: neon 3s ease-in-out infinite; }
    #tag { animation: subtle 4s ease-in-out infinite; }

    @keyframes up {
      0%,100% { transform: translateY(8px); opacity: 0.6; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes cubeGlow { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
    @keyframes fillPulse { 0%,100% { fill-opacity: 0.12; } 50% { fill-opacity: 0.3; } }
    @keyframes shimmer { 0%,100% { stroke-opacity: 0.5; } 50% { stroke-opacity: 1; } }
    @keyframes dot { 0%,100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.5); opacity: 1; } }
    @keyframes neon { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    @keyframes subtle { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0c14"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d78"/>
      <stop offset="1" stop-color="#d70a53"/>
    </linearGradient>
  </defs>

  <!-- icône (512 → 180), centrée verticalement -->
  <g transform="translate(10 10) scale(0.3516)">
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <g id="cube" fill="none" stroke="url(#red)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <path id="cubeFill" d="M256 150 L356 205 V315 L256 370 L156 315 V205 Z" fill="#d70a53" fill-opacity="0.12"/>
      <path d="M156 205 L256 260 L356 205"/>
      <path d="M256 260 V370"/>
    </g>
    <g id="arrow" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M256 245 V84"/>
      <path d="M204 136 L256 84 L308 136"/>
    </g>
    <path id="curve" d="M92 436 Q256 376 420 436" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="12" stroke-linecap="round"/>
    <circle class="dot fb" cx="92" cy="436" r="9" fill="#d70a53"/>
    <circle class="dot dot2 fb" cx="420" cy="436" r="9" fill="#d70a53"/>
  </g>

  <!-- wordmark + tagline centrés sur le même axe (x=360) -->
  <g font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" text-anchor="middle">
    <text x="360" y="116" font-size="88" font-weight="700" letter-spacing="-2">
      <tspan fill="#8a8a99">de</tspan><tspan id="bup" fill="#d70a53">bup</tspan>
    </text>
    <text id="tag" x="360" y="152" font-size="16" fill="#8a8a99" letter-spacing="3">GITHUB ⇄ APT</text>
  </g>
</svg>
